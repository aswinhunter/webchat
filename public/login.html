
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .login-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; max-width: 250px; margin-bottom: 20px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Choose Your Username</h2>
        <input id="username-input" placeholder="Enter your name" onkeypress="if(event.keyCode === 13) login()" maxlength="15" />
        <button onclick="login()">Start Chatting</button>
    </div>

    <script>
        function login() {
            const inputElement = document.getElementById("username-input");
            const username = inputElement.value.trim();

            if (username === "") {
                alert("Please enter a username.");
                return;
            }

            // Redirect to index.html and pass the username as a URL parameter
            window.location.href = `index.html?username=${encodeURIComponent(username)}`;
        }
    </script>

</body>
</html>
