<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; }
        #chat { list-style: none; padding: 0; max-height: 400px; overflow-y: auto; border: 1px solid #ccc; background: white; padding: 10px; border-radius: 8px; margin-bottom: 10px;}
        #chat li { padding: 5px 0; border-bottom: 1px dotted #eee; }
        #chat li:last-child { border-bottom: none; }
        input#msg { padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 300px; margin-right: 10px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h1>Simple Chat Application</h1>

    <div class="input-container">
        <input id="msg" placeholder="Type message..." onkeypress="if(event.keyCode === 13) send()" />
        <button onclick="send()">Send</button>
    </div>

    <ul id="chat"></ul>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script>
        const socket = io("http://localhost:5000");

        // Function to display a message in the chat list
        function displayMessage(data) {
            const li = document.createElement("li");
            li.innerText = data;
            document.getElementById("chat").appendChild(li);
            // Auto-scroll to the latest message
            const chatWindow = document.getElementById("chat");
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // 1. LISTENER: This handles messages received from OTHERS (and the server echo)
        socket.on("message", (data) => {
            // Note: The server sends the message back to ALL clients, including the sender.
            // This is generally redundant when using the local display logic below,
            // but is necessary for all other clients.
            displayMessage(data);
        });

        function send() {
            const inputElement = document.getElementById("msg");
            const text = inputElement.value.trim();

            if (text === "") return;

            // 2. SENDER UPDATE: Display the message immediately in the sender's window
            // This ensures a responsive UI and avoids the issue you experienced.
            displayMessage(text);
            
            // 3. EMIT: Send the message to the server
            socket.emit("message", text);
            
            // Clear the input field
            inputElement.value = "";
        }
    </script>

</body>
</html>
