<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            background-color: #e0e0e0; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .chat-container { 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.15); 
            width: 100%; 
            max-width: 700px; 
            height: 90vh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .chat-header {
            background-color: #007bff;
            color: white;
            padding: 15px 20px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .chat-header h1 {
            margin: 0;
            font-size: 1.5em;
            text-align: center; 
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: fit-content; 
            white-space: nowrap; 
        }
        .profile-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
            position: absolute; 
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 11;
        }
        /* Assuming you put an image named user_profile.png in the public folder */
        .profile-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #chat { 
            list-style: none; 
            padding: 20px; 
            flex-grow: 1; 
            overflow-y: auto; 
            background: #f9f9f9; 
            margin: 0;
        }
        #chat li { 
            padding: 8px 0; 
            word-wrap: break-word; 
            display: flex;
            align-items: flex-start;
        }

        /* --- Message Alignment & Styling --- */
        .message-content {
            padding: 8px 12px;
            border-radius: 18px;
            max-width: 70%;
            display: inline-block;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            line-height: 1.4;
        }

        /* Your Messages (Self) - ALIGN RIGHT */
        .self-msg {
            justify-content: flex-end; 
        }
        .self-msg .message-content {
            background-color: #DCF8C6; 
            color: #111;
        }

        /* Other User Messages (Other) - ALIGN LEFT */
        .other-msg {
            justify-content: flex-start; 
        }
        .other-msg .message-content {
            background-color: #E2E2E2; 
            color: #111;
        }
        
        .username-msg { 
            font-weight: bold; 
            margin-right: 8px; 
            color: #007bff; 
        }
        .self-msg .username-msg {
            color: #28a745; 
        }
        /* --- End Message Alignment & Styling --- */


        .input-area { 
            padding: 15px 20px; 
            background-color: #f0f0f0; 
            border-top: 1px solid #ddd;
            display: flex;
            align-items: center;
            /* Input is now correctly placed at the bottom */
            z-index: 10;
        }
        input#msg { 
            flex-grow: 1; 
            padding: 12px 15px; 
            border: 1px solid #ccc; 
            border-radius: 25px; 
            margin-right: 10px; 
            font-size: 1em;
            outline: none;
        }
        input#msg:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
        }
        .send-button { 
            padding: 12px 25px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-size: 1em;
            transition: background-color 0.2s ease;
        }
        .send-button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1 id="welcome-header">Welcome!</h1>
            <div class="profile-icon" onclick="goToProfile()">
                <img src="/user_profile.png" alt="Profile" />
            </div>
        </div>
        
        <ul id="chat"></ul>

        <div class="input-area">
            <input id="msg" placeholder="Type your message..." onkeypress="if(event.keyCode === 13) send()" />
            <button class="send-button" onclick="send()">Send</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <script>
        let socket;
        let username;
        let currentFirebaseUid;
        
        // Your provided Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDCpJ1pfkHQXwjOlG7FHeh3XxtxwFkLscI",
            authDomain: "newapplicatioon.firebaseapp.com",
            projectId: "newapplicatioon",
            storageBucket: "newapplicatioon.firebasestorage.app",
            messagingSenderId: "197141078730",
            appId: "1:197141078730:web:5440a7bfd71e2a9a92ca33",
            measurementId: "G-F1FE2F770S"
        };
        
        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        window.onload = function() {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentFirebaseUid = user.uid;
                    fetchUsernameAndConnect(user.uid);
                } else {
                    window.location.href = 'auth.html';
                }
            });
        };

        async function fetchUsernameAndConnect(uid) {
            try {
                const response = await fetch(`/api/user/details/${uid}`);
                const data = await response.json();

                if (response.ok) {
                    username = data.username;
                    // Update header to center the welcome message
                    document.getElementById('welcome-header').innerHTML = `Welcome, ${username}!`; 
                    connectSocket();
                } else {
                    alert('Error: Could not retrieve your username from the server. Please sign up again.');
                    auth.signOut();
                }
            } catch (error) {
                console.error("Error fetching username:", error);
                alert('Connection error with server. Please try again.');
                auth.signOut();
            }
        }
        
        function goToProfile() {
            window.location.href = 'profile.html';
        }

        function connectSocket() {
            socket = io("http://localhost:5000");

            socket.on("history", (messages) => {
                const chatWindow = document.getElementById("chat");
                chatWindow.innerHTML = '';
                messages.forEach(msg => {
                    // NEW: Compare by permanent UID
                    displayMessage(msg.text, msg.username, msg.firebaseUid === currentFirebaseUid);
                });
            });

            socket.on("message", (data) => {
                // NEW: Compare by permanent UID
                displayMessage(data.text, data.username, data.firebaseUid === currentFirebaseUid);
            });
        }

        function displayMessage(text, sender, isSelf) {
            const li = document.createElement("li");
            li.className = isSelf ? 'self-msg' : 'other-msg';

            const messageContent = document.createElement("div");
            messageContent.className = 'message-content';
            
            // Username is included inside the message bubble for a cleaner look
            const usernameSpan = document.createElement("span");
            usernameSpan.className = 'username-msg';
            usernameSpan.innerText = `${sender}: `;

            messageContent.appendChild(usernameSpan);
            messageContent.append(text);
            li.appendChild(messageContent);

            document.getElementById("chat").appendChild(li);
            const chatWindow = document.getElementById("chat");
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function send() {
            if (!socket || !username) return;

            const inputElement = document.getElementById("msg");
            const text = inputElement.value.trim();

            if (text === "") return;

            const messageData = {
                username: username,
                text: text,
                firebaseUid: currentFirebaseUid // <--- NEW: Send the UID
            };

            socket.emit("message", messageData);
            inputElement.value = "";
        }
    </script>

</body>
</html>
