<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>
    <style>
        /* (Styles remain the same) */
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #chat { list-style: none; padding: 0; max-height: 400px; overflow-y: auto; border: 1px solid #ccc; background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 10px;}
        #chat li { padding: 5px 0; border-bottom: 1px dotted #eee; word-wrap: break-word; }
        #chat li:last-child { border-bottom: none; }
        .username-msg { font-weight: bold; color: #007bff; margin-right: 5px; }
        .self-msg { color: #28a745; }
        input#msg { padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: calc(100% - 90px - 15px); margin-right: 10px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .input-container { display: flex; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="welcome-header">Loading Chat...</h1>
        <ul id="chat"></ul>
        <div class="input-container">
            <input id="msg" placeholder="Type message..." onkeypress="if(event.keyCode === 13) send()" disabled />
            <button onclick="send()" disabled>Send</button>
        </div>
        <button onclick="logout()" style="background-color: #dc3545; width: 100%; margin-top: 10px;">Log Out</button>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script type="module">
        import { 
            auth, 
            onAuthStateChanged,
            signOut 
        } from './js/firebase-config.js'; // Firestore imports removed

        let socket;
        let username;
        const inputElement = document.getElementById("msg");
        const sendButton = document.querySelector("button[onclick='send()']");

        // --- Auth State Listener and Initialization ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // User is signed in, now fetch their chat profile (username) from the Node.js server
                await fetchUserProfile(user.uid);
                
                if (username) {
                    connectSocket();
                    inputElement.disabled = false;
                    sendButton.disabled = false;
                    document.getElementById('welcome-header').innerText = `Welcome, ${username}!`;
                } else {
                    // Fallback if profile data is missing in MongoDB
                    alert("User profile not found in MongoDB. Redirecting to sign up.");
                    // Sign out the user to clear the session
                    await signOut(auth);
                    window.location.href = 'auth.html';
                }
            } else {
                // User is signed out or session expired/invalid
                window.location.href = 'auth.html';
            }
        });

        // NEW: Function to fetch profile from the Node.js server API
        async function fetchUserProfile(uid) {
            try {
                const response = await fetch(`/api/username/${uid}`);
                if (response.ok) {
                    const data = await response.json();
                    username = data.username; // Set the chat username
                } else {
                    console.error("Failed to fetch username from server:", response.status);
                    username = undefined;
                }
            } catch (error) {
                console.error("Network or server error during profile fetch:", error);
                username = undefined;
            }
        }

        function logout() {
            signOut(auth).then(() => {
                window.location.href = 'auth.html';
            }).catch((error) => {
                console.error("Logout Error:", error);
                alert("Could not log out.");
            });
        }
        window.logout = logout; // Make logout globally accessible for HTML button


        // --- Socket Logic (Unchanged) ---
        function connectSocket() {
            socket = io("http://localhost:5000");
            socket.on("message", (data) => {
                displayMessage(data.text, data.username, false);
            });
        }

        function displayMessage(text, sender, isSelf) {
            const li = document.createElement("li");
            const usernameSpan = document.createElement("span");
            usernameSpan.className = 'username-msg';
            usernameSpan.innerText = `${sender}: `;

            if (isSelf) {
                li.className = 'self-msg';
            }

            li.appendChild(usernameSpan);
            li.append(text);

            document.getElementById("chat").appendChild(li);
            const chatWindow = document.getElementById("chat");
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function send() {
            if (!socket || !username) return;
            const text = inputElement.value.trim();
            if (text === "") return;

            const messageData = {
                username: username,
                text: text
            };

            displayMessage(text, username, true);
            socket.emit("message", messageData);
            inputElement.value = "";
        }
        window.send = send;
    </script>

</body>
</html>
