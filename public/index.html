<!DOCTYPE html>
<html>
<head>
    <title>Group Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            background-color: #e0e0e0; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .chat-container { 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.15); 
            width: 100%; 
            max-width: 700px; 
            height: 90vh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .chat-header {
            background-color: #007bff;
            color: white;
            padding: 15px 20px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .chat-header h1 {
            margin: 0;
            font-size: 1.5em;
            text-align: center; 
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: fit-content; 
            white-space: nowrap; 
        }
        .profile-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
            position: absolute; 
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 11;
        }
        .profile-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* NEW: Navigation Bar Styling */
        .chat-nav {
            display: flex;
            justify-content: space-around;
            background-color: #f0f0f0;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }
        .chat-nav a {
            text-decoration: none;
            color: #555;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .chat-nav a:hover {
            background-color: #ddd;
        }
        .chat-nav .active {
            background-color: #007bff;
            color: white;
            pointer-events: none; /* Disable clicking the current tab */
        }
        
        #chat { 
            list-style: none; 
            padding: 20px; 
            flex-grow: 1; 
            overflow-y: auto; 
            background: #f9f9f9; 
            margin: 0;
        }
        #chat li { 
            padding: 8px 0; 
            word-wrap: break-word; 
            display: flex;
            align-items: flex-start;
        }
        .message-content {
            padding: 8px 12px;
            border-radius: 18px;
            max-width: 70%;
            display: inline-block;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            line-height: 1.4;
        }
        .self-msg { justify-content: flex-end; }
        .self-msg .message-content { background-color: #DCF8C6; color: #111; }
        .other-msg { justify-content: flex-start; }
        .other-msg .message-content { background-color: #E2E2E2; color: #111; }
        .username-msg { font-weight: bold; margin-right: 8px; color: #007bff; }
        .self-msg .username-msg { color: #28a745; }
        .clickable-username {
            cursor: pointer;
            text-decoration: underline;
        }

        .input-area { 
            padding: 15px 20px; 
            background-color: #f0f0f0; 
            border-top: 1px solid #ddd;
            display: flex;
            align-items: center;
            z-index: 10;
        }
        input#msg { 
            flex-grow: 1; 
            padding: 12px 15px; 
            border: 1px solid #ccc; 
            border-radius: 25px; 
            margin-right: 10px; 
            font-size: 1em;
            outline: none;
        }
        input#msg:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
        }
        .send-button { 
            padding: 12px 25px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-size: 1em;
            transition: background-color 0.2s ease;
        }
        .send-button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1 id="welcome-header">Welcome!</h1>
            <div class="profile-icon" onclick="goToProfile()">
                <img src="/user_profile.png" alt="Profile" />
            </div>
        </div>
        
        <!-- NEW: Navigation Bar -->
        <div class="chat-nav">
            <a href="index.html" class="active">Group Chat</a>
            <a href="one_one_chat.html">1-1 Chat</a>
            <a href="one_one_vc.html">1-1 VC</a>
        </div>
        <!-- END NEW: Navigation Bar -->
        
        <ul id="chat"></ul>

        <div class="input-area">
            <input id="msg" placeholder="Type your message..." onkeypress="if(event.keyCode === 13) send()" />
            <button class="send-button" onclick="send()">Send</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <script>
        let socket;
        let username;
        let currentFirebaseUid;
        let userMap = {}; // NEW: Global cache for UID -> Current Username lookup
        
        const firebaseConfig = {
            apiKey: "AIzaSyDCpJ1pfkHQXwjOlG7FHeh3XxtxwFkLscI",
            authDomain: "newapplicatioon.firebaseapp.com",
            projectId: "newapplicatioon",
            storageBucket: "newapplicatioon.firebasestorage.app",
            messagingSenderId: "197141078730",
            appId: "1:197141078730:web:5440a7bfd71e2a9a92ca33",
            measurementId: "G-F1FE2F770S"
        };
        
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        window.onload = function() {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentFirebaseUid = user.uid;
                    fetchUserDataAndConnect(user.uid); 
                } else {
                    window.location.href = 'auth.html';
                }
            });
        };

        async function fetchUserDataAndConnect(uid) {
            try {
                // 1. Fetch current usernames map for ALL users (Low-cost operation)
                const mapResponse = await fetch('/api/users/name-map');
                userMap = await mapResponse.json();

                // 2. Fetch current user's details
                const userResponse = await fetch(`/api/user/details/${uid}`);
                const userData = await userResponse.json();

                if (userResponse.ok) {
                    username = userData.username;
                    document.getElementById('welcome-header').innerHTML = `Welcome, ${username}!`; 
                    
                    await fetchHistory(); // Load history using the now-available userMap
                    connectSocket(); 
                } else {
                    alert('Error: Could not retrieve your username from the server. Please ensure you completed signup.');
                    auth.signOut();
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                alert('Connection error with server. Please ensure your Node.js server is running and accessible.');
                auth.signOut();
            }
        }
        
        // Function to fetch history via API
        async function fetchHistory() {
            try {
                const historyResponse = await fetch('/api/group/history');
                const messages = await historyResponse.json();

                const chatWindow = document.getElementById("chat");
                chatWindow.innerHTML = '';
                
                messages.forEach(msg => {
                    // Alignment relies on the firebaseUid
                    const isSelf = msg.firebaseUid === currentFirebaseUid;
                    // NAME LOOKUP: Use the userMap to get the CURRENT name for the sender's UID
                    const displaySender = userMap[msg.firebaseUid] || msg.username; 
                    
                    displayMessage(msg.text, displaySender, isSelf);
                });

            } catch (error) {
                console.error("Error fetching chat history:", error);
            }
        }
        
        function goToProfile() {
            window.location.href = 'profile.html';
        }

        function connectSocket() {
            socket = io("http://localhost:5000");

            socket.emit('identify', { firebaseUid: currentFirebaseUid });

            socket.on("message", (data) => {
                // Real-time message: Use the UID in the payload to lookup the current name
                const isSelf = data.firebaseUid === currentFirebaseUid;
                const displaySender = userMap[data.firebaseUid] || data.username; 

                displayMessage(data.text, displaySender, isSelf);
            });
        }
        
        function displayMessage(text, sender, isSelf) {
            const li = document.createElement("li");
            li.className = isSelf ? 'self-msg' : 'other-msg';

            const messageContent = document.createElement("div");
            messageContent.className = 'message-content';
            
            const usernameSpan = document.createElement("span");
            usernameSpan.className = 'username-msg';
            usernameSpan.innerText = `${sender}: `;

            messageContent.appendChild(usernameSpan);
            messageContent.append(text);
            li.appendChild(messageContent);

            document.getElementById("chat").appendChild(li);
            const chatWindow = document.getElementById("chat");
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function send() {
            if (!socket || !username) return;

            const inputElement = document.getElementById("msg");
            const text = inputElement.value.trim();

            if (text === "") return;

            const messageData = {
                username: username, // Sends the CURRENT username (for the DB record)
                text: text,
                firebaseUid: currentFirebaseUid // Crucial for lookup/alignment
            };
            
            // OPTIONAL CLIENT-SIDE CACHE UPDATE: Ensure your local map is up-to-date instantly
            userMap[currentFirebaseUid] = username;

            socket.emit("message", messageData);
            inputElement.value = "";
        }
    </script>

</body>
</html>
