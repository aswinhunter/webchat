<!DOCTYPE html>
<html>
<head>
    <title>1-1 Chat Lobby</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            background-color: #e0e0e0; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container { 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.15); 
            width: 100%; 
            max-width: 700px; 
            height: 90vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        h1 { color: #007bff; }
        p { color: #555; }
        a { color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container" id="lobby-container">
        <h1>1-1 Chat Lobby</h1>
        <p>Available users for private text chat:</p>
        <ul id="user-list" style="list-style:none; padding:0; margin:10px 0; display:flex; flex-direction:column; gap:8px; width:100%; align-items:center; max-width:640px"></ul>
        <p>Go back to the <a href="index.html">Group Chat</a> to continue.</p>
    </div>
    
    <!-- Chat UI (replaces placeholder) -->
    <div class="container" id="dm-container" style="display:none; align-items:stretch;">
        <div style="padding: 12px 16px; width: 100%; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee;">
            <!-- Back + Username grouped in a pill with divider -->
            <div style="display:flex; align-items:center; gap:12px;">
                <div id="back-username-box" style="display:flex; align-items:center; gap:12px; background: #f5f8fd; border:1px solid #e1e8ff; padding:6px 10px; border-radius:8px; box-shadow:0 1px 0 rgba(0,0,0,0.03);">
                    <a href="one_one_chat.html" style="color:#007bff; font-weight:700; text-decoration:none;">Back</a>
                    <div style="width:1px; height:20px; background:#d7dbe8; border-radius:1px;"></div>
                    <!-- Username placed to the right of Back; clickable to open readonly profile -->
                    <a id="dm-username" href="javascript:void(0)" style="font-weight:700; color:#0b5ed7; text-decoration:none; cursor:pointer;">User</a>
                </div>
            </div>
            <div style="flex:1; text-align:center; visibility:hidden;">&nbsp;</div>
            <div></div>
        </div>
        <ul id="dm-chat" style="list-style:none; padding:15px 8px; flex-grow:1; overflow:auto; margin:0; height:60vh; background:#f8f8f8; width:100%; box-sizing:border-box;"></ul>
        <div style="display:flex; padding:10px; gap:8px; background:#f0f0f0;">
            <input id="dm-msg" placeholder="Type a message" style="flex:1; padding:10px; border-radius:8px; border:1px solid #ccc;"/>
            <button id="dm-send" style="padding:10px 15px; border-radius:8px; background:#007bff; color:white; border:none;">Send</button>
        </div>
    </div>

    <!-- Read-only User Details Modal (larger, richer layout) -->
    <div id="user-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); align-items:center; justify-content:center; z-index:9999;">
        <div style="background:#fff; width:460px; max-width:96%; margin:auto; border-radius:10px; box-shadow:0 16px 48px rgba(0,0,0,0.35); overflow:hidden;">
            <div style="padding:14px 18px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; background: linear-gradient(90deg,#f7fbff,#ffffff);">
                <strong style="font-size:16px;">User Details</strong>
                <button id="close-user-modal" style="background:transparent; border:none; font-size:20px; cursor:pointer; color:#666;">✕</button>
            </div>
            <div id="user-details-content" style="padding:18px; display:flex; gap:16px; align-items:flex-start;">
                <div style="width:96px; height:96px; border-radius:12px; background:#f0f0f0; display:flex; align-items:center; justify-content:center; font-weight:700; color:#666;">IMG</div>
                <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
                    <div style="display:flex; gap:12px; align-items:center;"><div style="min-width:110px; color:#444;"><strong>Name</strong></div><div id="ud-name" style="color:#222"></div></div>
                    <div style="display:flex; gap:12px; align-items:center;"><div style="min-width:110px; color:#444;"><strong>Username</strong></div><div id="ud-username" style="color:#222"></div></div>
                    <div style="display:flex; gap:12px; align-items:center;"><div style="min-width:110px; color:#444;"><strong>Age</strong></div><div id="ud-age" style="color:#222"></div></div>
                    <div style="display:flex; gap:12px; align-items:center;"><div style="min-width:110px; color:#444;"><strong>Weight</strong></div><div id="ud-weight" style="color:#222"></div></div>
                    <div style="display:flex; gap:12px; align-items:center;"><div style="min-width:110px; color:#444;"><strong>Role</strong></div><div id="ud-role" style="color:#222"></div></div>
                    <div style="display:flex; gap:12px; align-items:center;"><div style="min-width:110px; color:#444;"><strong>Type</strong></div><div id="ud-type" style="color:#222"></div></div>
                    <div style="display:flex; gap:12px; align-items:center;"><div style="min-width:110px; color:#444;"><strong>Phone</strong></div><div id="ud-phone" style="color:#222"></div></div>
                    <div style="display:flex; gap:12px; align-items:flex-start;"><div style="min-width:110px; color:#444;"><strong>About</strong></div><div id="ud-about" style="color:#222; max-width:260px;"></div></div>
                </div>
            </div>
            <div style="padding:12px 18px; border-top:1px solid #eee; text-align:right; background:#fbfbfe;"><button id="close-user-modal-2" style="padding:8px 14px; border-radius:6px; background:#0b5ed7; color:#fff; border:none; cursor:pointer;">Close</button></div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDCpJ1pfkHQXwjOlG7FHeh3XxtxwFkLscI",
            authDomain: "newapplicatioon.firebaseapp.com",
            projectId: "newapplicatioon",
            storageBucket: "newapplicatioon.firebasestorage.app",
            messagingSenderId: "197141078730",
            appId: "1:197141078730:web:5440a7bfd71e2a9a92ca33",
            measurementId: "G-F1FE2F770S"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let socket;
        let currentFirebaseUid;
        let currentUsername;
        let otherUid;
        let room;

        function parseQuery() {
            const params = new URLSearchParams(window.location.search);
            return params.get('uid');
        }

        function createRoomName(uid1, uid2) {
            const arr = [uid1, uid2].sort();
            return `${arr[0]}_${arr[1]}`;
        }

        window.onload = function() {
            otherUid = parseQuery();
                if (!otherUid) {
                    // show the placeholder listing: fill user list and return
                    auth.onAuthStateChanged(async (user) => {
                        if (!user) return window.location.href = 'auth.html';
                        currentFirebaseUid = user.uid;
                            try {
                                const res = await fetch(`/api/dm/peers/${currentFirebaseUid}`);
                                const peers = await res.json();
                                const userList = document.getElementById('user-list');
                                userList.innerHTML = '';
                                peers.forEach(p => {
                                    const li = document.createElement('li');
                                    li.style.width = '100%';
                                    li.style.display = 'flex';
                                    li.style.justifyContent = 'center';
                                    li.style.alignItems = 'center';
                                    const btn = document.createElement('button');
                                    btn.style.padding = '10px 16px';
                                    btn.style.border = '1px solid #ddd';
                                    btn.style.borderRadius = '8px';
                                    btn.style.background = '#fff';
                                    btn.style.width = '100%';
                                    btn.style.maxWidth = '640px';
                                    btn.style.cursor = 'pointer';
                                    // Compose label with name, snippet, and timestamp
                                    btn.innerHTML = `<div style="display:flex; justify-content:space-between; width:100%;"><div style=\"text-align:left;\"><strong>${p.username}</strong><br/><small style=\"color:#666;\">${p.lastMessage ? (p.lastMessage.length > 36 ? p.lastMessage.slice(0,36) + '...' : p.lastMessage) : ''}</small></div><div style=\"color:#888; font-size:0.8em; text-align:right;\">${new Date(p.timestamp).toLocaleString()}</div></div>`;
                                    btn.onclick = () => { window.location.href = `one_one_chat.html?uid=${encodeURIComponent(p.uid)}`; };
                                    li.appendChild(btn);
                                    userList.appendChild(li);
                                });
                        } catch (err) {
                            console.error('Error fetching users for lobby', err);
                        }
                    });
                    return;
                }
            // Show the DM container and hide the lobby
            document.getElementById('dm-container').style.display = 'flex';
            document.getElementById('lobby-container').style.display = 'none';

            auth.onAuthStateChanged(async (user) => {
                if (!user) return window.location.href = 'auth.html';
                currentFirebaseUid = user.uid;
                // fetch current username
                const meResp = await fetch(`/api/user/details/${currentFirebaseUid}`);
                const meData = await meResp.json();
                currentUsername = meData.username;

                // fetch other user's display name
                const othersResp = await fetch(`/api/user/full-details/${otherUid}`);
                const otherData = await othersResp.json();
                const displayName = otherData.username || otherData.name || 'Unknown';
                const dmUsernameEl = document.getElementById('dm-username');
                if (dmUsernameEl) {
                    dmUsernameEl.innerText = displayName;
                    dmUsernameEl.onclick = function() { showUserDetails(otherUid); };
                }

                // compute the room
                room = createRoomName(currentFirebaseUid, otherUid);

                // Connect socket
                socket = io('http://localhost:5000');
                socket.emit('identify', { firebaseUid: currentFirebaseUid });
                socket.emit('joinPrivate', { room });

                socket.on('privateMessage', (data) => {
                    if (data.room !== room) return; // ignore unrelated rooms
                    displayDM(data.text, data.senderName, data.senderUid === currentFirebaseUid, data.timestamp);
                });

                // Load history
                loadDMHistory();
            });
        }

        async function loadDMHistory() {
            try {
                const res = await fetch(`/api/dm/history/${room}`);
                const messages = await res.json();
                const chat = document.getElementById('dm-chat');
                chat.innerHTML = '';
                messages.forEach(msg => {
                    const isSelf = msg.senderUid === currentFirebaseUid;
                    displayDM(msg.text, msg.senderName, isSelf, msg.timestamp);
                });
            } catch (err) {
                console.error('Error loading DM history', err);
            }
        }

        function displayDM(text, sender, isSelf, timestamp) {
            const chat = document.getElementById('dm-chat');
            const li = document.createElement('li');
            li.style.display = 'flex';
            li.style.justifyContent = isSelf ? 'flex-end' : 'flex-start';
            li.style.padding = '6px 0';
            li.style.width = '100%';
            li.style.boxSizing = 'border-box';
            const bubble = document.createElement('div');
            bubble.style.maxWidth = '70%';
            bubble.style.padding = '8px 12px';
            bubble.style.borderRadius = '14px';
            bubble.style.background = isSelf ? '#DCF8C6' : '#E2E2E2';
            bubble.style.color = '#111';
            bubble.style.boxShadow = '0 1px 2px rgba(0,0,0,0.05)';
            /* Align bubble to the correct side by using auto margins */
            bubble.style.marginLeft = isSelf ? 'auto' : '0';
            bubble.style.marginRight = isSelf ? '0' : 'auto';
            if (!isSelf) {
                const name = document.createElement('div');
                name.style.fontWeight = '700';
                name.style.marginBottom = '6px';
                name.innerText = sender;
                bubble.appendChild(name);
            }
            bubble.appendChild(document.createTextNode(text));
            li.appendChild(bubble);
            // timestamp
            const tsEl = document.createElement('div');
            tsEl.style.fontSize = '12px';
            tsEl.style.color = '#666';
            tsEl.style.marginTop = '4px';
            tsEl.style.marginLeft = isSelf ? '8px' : '0';
            tsEl.style.marginRight = isSelf ? '0' : '8px';
            tsEl.innerText = timestamp ? new Date(timestamp).toLocaleTimeString() : '';
            li.appendChild(tsEl);
            chat.appendChild(li);
            chat.scrollTop = chat.scrollHeight;
        }

        // Show a read-only modal with user details fetched from server
        async function showUserDetails(uid) {
            try {
                const res = await fetch(`/api/user/full-details/${encodeURIComponent(uid)}`);
                if (!res.ok) throw new Error('Failed to fetch user details');
                const data = await res.json();

                document.getElementById('ud-username').innerText = data.username || '-';
                document.getElementById('ud-age').innerText = data.age !== undefined ? data.age : '-';
                document.getElementById('ud-weight').innerText = data.weight !== undefined ? data.weight : '-';
                document.getElementById('ud-role').innerText = data.role || '-';
                document.getElementById('ud-type').innerText = data.type || '-';
                document.getElementById('ud-phone').innerText = data.phone || '-';
                document.getElementById('ud-about').innerText = data.about || '-';

                // If there is an avatar or image URL, replace the IMG placeholder
                if (data.avatarUrl) {
                    const imgBox = document.querySelector('#user-details-content > div');
                    if (imgBox) {
                        imgBox.innerHTML = `<img src="${data.avatarUrl}" alt="avatar" style="width:96px;height:96px;border-radius:10px;object-fit:cover;">`;
                    }
                }

                const modal = document.getElementById('user-modal');
                modal.style.display = 'flex';

                // wire close buttons
                document.getElementById('close-user-modal').onclick = closeUserModal;
                document.getElementById('close-user-modal-2').onclick = closeUserModal;
                // clicking outside content closes the modal
                modal.onclick = function(e) { if (e.target === modal) closeUserModal(); };
            } catch (err) {
                console.error('Error loading user details', err);
                alert('Could not load user details.');
            }
        }

        function closeUserModal() {
            const modal = document.getElementById('user-modal');
            if (modal) modal.style.display = 'none';
        }

        document.getElementById('dm-send').onclick = sendDM;
        document.getElementById('dm-msg').onkeypress = function(e) { if (e.key === 'Enter') sendDM(); };

        function sendDM() {
            const input = document.getElementById('dm-msg');
            const text = input.value.trim();
            if (!text) return;
            if (!socket || !room) return;

            const payload = {
                senderUid: currentFirebaseUid,
                receiverUid: otherUid,
                room,
                senderName: currentUsername,
                text
            };
            socket.emit('privateMessage', payload);
            input.value = '';
        }
    </script>
</body>
</html>
